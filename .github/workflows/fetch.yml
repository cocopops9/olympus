name: fetch
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o wakeC.mp4 'https://mcp-tools-wan-2-2-first-last-frame.hf.space/--replicas/rxgsd/gradio_api/file=/tmp/gradio/62b3eeaf97c458da7726ddfed99401be65094070f803b51375562ddf1ceb1760/tmp_oz0yroj.mp4'
          curl -fsSL -o wakeD.mp4 'https://mcp-tools-wan-2-2-first-last-frame.hf.space/--replicas/rxgsd/gradio_api/file=/tmp/gradio/648c5a74a6a4e49b62dd7e8a0e16388587c55dbf71b303ba88964f2b0a303414/tmpgsf172ya.mp4'
          git config user.name olympus
          git config user.email noreply@anthropic.com
          git rm -q .github/workflows/fetch.yml
          git add wakeC.mp4 wakeD.mp4
          git commit -m videos
          git push
