# Olympus: checks the live Supabase server the way the phone app uses it (scripts/supabase-e2e.mjs)
# after every deploy of the function. The address is the repository variable
# OLYMPUS_SERVER, or the project this repository deploys to.
name: Supabase server check

on:
  push:
    branches: [main]
    # supabase/DEPLOYED names the commit the live function runs; it changes right after a deploy,
    # so the check runs against the code it is meant to check.
    paths:
      - 'supabase/DEPLOYED'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/supabase-e2e.mjs
        env:
          OLYMPUS_SERVER: ${{ vars.OLYMPUS_SERVER || 'https://jmhvabcwzrnzscbtqblk.supabase.co/functions/v1/olympus' }}
