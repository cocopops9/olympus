# Olympus: builds the Android APK on every push to main and publishes it as the single asset of
# the "android" release, so one link always downloads the newest build:
#   https://github.com/<owner>/<repo>/releases/latest/download/olympus.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    # 24.04 ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.OLYMPUS_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm ci
        working-directory: frontend
      # The server the app joins by itself (lib/app-info.js DEFAULT_SERVER): the repository variable
      # OLYMPUS_SERVER when it is set; otherwise this repository's server on Supabase (supabase/).
      # APP_BUILD: the app knows its own build ("1.4.1+57", vite.config.js), which is how it tells
      # a newer one on the release (lib/update.js) and asks for a sign-in after an update.
      - run: npm run build:mobile
        working-directory: frontend
        env:
          VITE_OLYMPUS_SERVER: ${{ vars.OLYMPUS_SERVER || 'https://jmhvabcwzrnzscbtqblk.supabase.co/functions/v1/olympus' }}
          APP_BUILD: ${{ github.run_number }}

      # Secrets, when the repository has them, replace the public keystore in frontend/android.
      - name: Keystore from secrets
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/olympus.keystore"
          echo "OLYMPUS_KEYSTORE=$RUNNER_TEMP/olympus.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: frontend/android
        env:
          OLYMPUS_KEYSTORE_PASSWORD: ${{ secrets.OLYMPUS_KEYSTORE_PASSWORD }}
          OLYMPUS_KEY_ALIAS: ${{ secrets.OLYMPUS_KEY_ALIAS }}
          OLYMPUS_KEY_PASSWORD: ${{ secrets.OLYMPUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # On a failure, Gradle's own explanation becomes an annotation of the run: readable from
          # the run's summary and the checks API without downloading the whole log.
          if ! ./gradlew --no-daemon assembleRelease -PolympusVersionCode=$((1000 + GITHUB_RUN_NUMBER)) 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            why=$( { grep -A14 'What went wrong' "$RUNNER_TEMP/gradle.log" || true; grep -E 'error:|Duplicate class|AAPT: error|FAILED' "$RUNNER_TEMP/gradle.log" || true; echo '--- last lines ---'; tail -25 "$RUNNER_TEMP/gradle.log"; } \
              | head -90 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' || true)
            echo "::error title=Gradle build failed::$why"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/olympus.apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/olympus.apk" | head -3

      - uses: actions/upload-artifact@v7
        with:
          name: olympus-apk
          path: ${{ runner.temp }}/olympus.apk

      # One release, moved to this commit and given the new file each time.
      - name: Publish to the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android
          git push -f origin android
          # The checksum the in-app updater verifies the download against, and the build number
          # it compares with its own (lib/update.js buildOf).
          (cd "$RUNNER_TEMP" && sha256sum olympus.apk | cut -d' ' -f1 > olympus.apk.sha256)
          notes="Olympus for Android, Build ${GITHUB_RUN_NUMBER}, built from ${GITHUB_SHA::7}. Download olympus.apk on the phone and open it to install."
          if gh release view android > /dev/null 2>&1; then
            gh release edit android --title "Olympus for Android" --notes "$notes" --latest
          else
            gh release create android --title "Olympus for Android" --notes "$notes" --latest
          fi
          gh release upload android "$RUNNER_TEMP/olympus.apk" "$RUNNER_TEMP/olympus.apk.sha256" --clobber
