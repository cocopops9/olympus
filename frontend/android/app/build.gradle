apply plugin: 'com.android.application'

android {
    namespace "app.olympus.gym"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.olympus.gym"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes -PolympusVersionCode (a number that grows with every build) so each new APK
        // installs over the previous one; a local build keeps 26.
        versionCode((project.findProperty('olympusVersionCode') ?: '26') as int)
        versionName "1.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Olympus release signing. An APK must be signed to install, and every update must carry the
    // same signature as the version already on the phone. The keystore path and passwords come
    // from the environment (CI secrets); without them the build falls back to the Olympus keystore
    // in this folder, which is public with the code: fine for a personal build, but anyone who has
    // the repository can sign an APK your phone would accept as an update. See README.
    signingConfigs {
        release {
            storeFile file(System.getenv('OLYMPUS_KEYSTORE') ?: '../olympus-release.keystore')
            storePassword System.getenv('OLYMPUS_KEYSTORE_PASSWORD') ?: 'olympus-public'
            keyAlias System.getenv('OLYMPUS_KEY_ALIAS') ?: 'olympus'
            keyPassword System.getenv('OLYMPUS_KEY_PASSWORD') ?: 'olympus-public'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The barcode scanner's ML Kit library ships a native build for four CPU families.
            // Phones are ARM; the two x86 builds only serve emulators and a few Chromebooks, which
            // run ARM code through translation anyway. Leaving them out takes about 12 MB off
            // the APK. Release only: the debug build keeps x86_64 for the emulator test rig.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        debug {
            // Test build installs side-by-side with the real app: its own applicationId, so both
            // can live on one device. The name/icon label is overridden by the debug resource
            // overlay in src/debug/res. The release build (the "real" app) is untouched.
            applicationIdSuffix ".test"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Writing workouts and weigh-ins to Health Connect (#200, HealthConnectPlugin). Off until the
    // user turns it on. 1.1.0-alpha12 is the last release that builds with compileSdk 35 and AGP
    // 8.7; 1.1.0 stable asks for compileSdk 36 and AGP 8.9.1.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
