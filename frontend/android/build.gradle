// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Olympus: the Social Login plugin (Google sign-in) asks for androidx.browser 1.9.0, which needs
    // compileSdk 36 and a newer Android Gradle plugin than this project's. 1.8.0 has everything the
    // plugin uses (Custom Tabs) and builds with compileSdk 35; one version for every module also
    // keeps the compile and runtime classpaths in agreement.
    configurations.all {
        resolutionStrategy { force 'androidx.browser:browser:1.8.0' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
